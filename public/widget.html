<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Music Widget</title>
    <link rel="stylesheet" href="/css/widget.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        #obsAudioEngine {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 160px;
            height: 90px;
            z-index: -999;
            opacity: 0.01;
            pointer-events: none;
            overflow: hidden;
        }

        .access-denied {
            background: rgba(235, 4, 0, 0.85);
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="accessDeniedBox" style="display: none;" class="access-denied">
        Ошибка: укажите ключ виджета (?key=ВАШ_КЛЮЧ)
    </div>

    <!-- Hidden Audio Engine -->
    <div id="obsAudioEngine">
        <div id="obsYtPlayer"></div>
        <audio id="obsFallbackAudio" preload="auto"></audio>
    </div>

    <!-- Minimalist OBS Widget Card -->
    <div id="widgetCard" class="widget-card">
        <div class="title-container">
            <div id="trackTitle" class="track-title">Название трека</div>
        </div>
        <div class="track-meta-row">
            <span class="requester-text">Заказал: <span id="trackRequester" class="requester-name">Никнейм</span></span>
            <span id="trackTime" class="time-text">00:00 / 00:00</span>
        </div>
        <div class="widget-progress-container">
            <div id="widgetProgressFill" class="widget-progress-fill"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const widgetKey = urlParams.get('key');

        const accessDeniedBox = document.getElementById('accessDeniedBox');
        const widgetCard = document.getElementById('widgetCard');
        const trackTitle = document.getElementById('trackTitle');
        const trackRequester = document.getElementById('trackRequester');
        const trackTime = document.getElementById('trackTime');
        const widgetProgressFill = document.getElementById('widgetProgressFill');

        let currentTrackId = null;
        let currentTrackOrderId = null;
        let pendingTrack = null;
        let ytPlayer = null;
        let isYtReady = false;
        let isUsingFallbackAudio = false;
        let ytWatchdog = null;
        let socket = null;
        let progressInterval = null;
        let currentVolume = 80;

        const obsFallbackAudio = document.getElementById('obsFallbackAudio');
        if (obsFallbackAudio) {
            obsFallbackAudio.addEventListener('ended', () => {
                if (socket) socket.emit('widget_track_ended', widgetKey);
            });
            obsFallbackAudio.addEventListener('error', (e) => {
                console.warn('OBS fallback audio error:', e);
            });
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function autoScaleTitle() {
            const len = trackTitle.innerText.length;
            if (len > 70)       trackTitle.style.fontSize = '11.5px';
            else if (len > 50)  trackTitle.style.fontSize = '13px';
            else if (len > 35)  trackTitle.style.fontSize = '14.5px';
            else                trackTitle.style.fontSize = '16px';
        }

        function switchToFallbackAudio(track, seekTo) {
            if (!track || !track.id) return;
            if (ytWatchdog) clearTimeout(ytWatchdog);
            isUsingFallbackAudio = true;
            if (isYtReady && ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                try { ytPlayer.stopVideo(); } catch (e) {}
            }
            if (obsFallbackAudio) {
                const targetSrc = `/api/stream/${track.id}`;
                const currentSrcPath = obsFallbackAudio.src ? new URL(obsFallbackAudio.src, window.location.origin).pathname : '';

                if (currentSrcPath !== targetSrc) {
                    obsFallbackAudio.src = targetSrc;
                    const targetSeek = seekTo || 0;
                    const applySeek = () => {
                        if (targetSeek > 0) {
                            try { obsFallbackAudio.currentTime = targetSeek; } catch (e) {}
                        }
                    };
                    if (obsFallbackAudio.readyState >= 1) {
                        applySeek();
                    } else {
                        obsFallbackAudio.addEventListener('loadedmetadata', applySeek, { once: true });
                        obsFallbackAudio.addEventListener('canplay', applySeek, { once: true });
                    }
                } else if (seekTo !== undefined && Math.abs((obsFallbackAudio.currentTime || 0) - seekTo) > 1.5) {
                    obsFallbackAudio.currentTime = seekTo;
                }

                obsFallbackAudio.volume = currentVolume / 100;
                obsFallbackAudio.play().catch(e => console.warn('OBS audio play failed:', e));
            }
            startProgressReporter();
        }

        // ─── YouTube IFrame API ──────────────────────────────────────
        function initYouTube() {
            if (ytPlayer) return;
            ytPlayer = new YT.Player('obsYtPlayer', {
                height: '90',
                width: '160',
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    enablejsapi: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: () => {
                        isYtReady = true;
                        ytPlayer.unMute();
                        ytPlayer.setVolume(currentVolume);
                        startProgressReporter();
                        if (pendingTrack) {
                            loadTrack(pendingTrack, pendingTrack._seekTo || 0);
                            pendingTrack = null;
                        }
                    },
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.ENDED) {
                            if (socket) socket.emit('widget_track_ended', widgetKey);
                        }
                    },
                    onError: (event) => {
                        console.warn('YouTube IFrame error in OBS:', event.data, 'switching to direct stream');
                        if (currentTrackId) {
                            switchToFallbackAudio({ id: currentTrackId }, 0);
                        }
                    }
                }
            });
        }

        if (window.YT && window.YT.Player && window.YT.loaded) {
            initYouTube();
        } else {
            window.onYouTubeIframeAPIReady = initYouTube;
        }

        function loadTrack(track, seekTo) {
            if (!track || !track.id) return;
            if (ytWatchdog) clearTimeout(ytWatchdog);

            currentTrackId = track.id;
            currentTrackOrderId = track.orderId;

            // In OBS widget, we use direct audio stream immediately
            // This guarantees zero lag, instant start, and no Russian YouTube DPI desync
            switchToFallbackAudio(track, seekTo);
        }

        // ─── Progress Reporter — widget is the master source ─────────
        function startProgressReporter() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                let currentTime = 0;
                let duration = 0;

                if (isUsingFallbackAudio && obsFallbackAudio) {
                    currentTime = obsFallbackAudio.currentTime || 0;
                    duration = obsFallbackAudio.duration || 0;
                } else if (isYtReady && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                    currentTime = ytPlayer.getCurrentTime() || 0;
                    duration = ytPlayer.getDuration() || 0;
                } else {
                    return;
                }

                if (duration > 0) {
                    trackTime.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                    const pct = Math.min(100, Math.max(0, (currentTime / duration) * 100));
                    widgetProgressFill.style.width = `${pct}%`;
                    if (socket) {
                        socket.emit('widget_progress', { currentTime, duration, widgetKey });
                    }
                }
            }, 200);
        }

        // ─── Auth + Socket Init ───────────────────────────────────────
        async function init() {
            if (!widgetKey) {
                accessDeniedBox.style.display = 'inline-flex';
                return;
            }

            try {
                const res = await fetch('/api/auth/verify-widget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: widgetKey })
                });

                if (!res.ok) {
                    accessDeniedBox.style.display = 'inline-flex';
                    return;
                }

                initSocket();

                if (window.YT && window.YT.Player && !ytPlayer) {
                    window.onYouTubeIframeAPIReady();
                }

                setTimeout(() => {
                    if (!isYtReady && !isUsingFallbackAudio && pendingTrack) {
                        console.warn('[OBS Watchdog] YouTube script load timeout, playing direct audio');
                        switchToFallbackAudio(pendingTrack, pendingTrack._seekTo || 0);
                        pendingTrack = null;
                    }
                }, 3500);
            } catch (e) {
                accessDeniedBox.style.display = 'inline-flex';
            }
        }

        function initSocket() {
            socket = io();

            socket.on('state_update', (serverState) => {
                if (serverState.volume !== undefined) {
                    currentVolume = serverState.volume;
                    if (obsFallbackAudio) obsFallbackAudio.volume = currentVolume / 100;
                    if (isYtReady && ytPlayer && typeof ytPlayer.setVolume === 'function') {
                        ytPlayer.setVolume(currentVolume);
                    }
                }

                const track = serverState.currentTrack;
                updateWidgetCard(track);

                if (track && (track.orderId !== currentTrackOrderId || track.id !== currentTrackId)) {
                    currentTrackOrderId = track.orderId;
                    loadTrack(track, serverState.currentTime || 0);
                } else if (!track && (currentTrackOrderId || currentTrackId)) {
                    currentTrackOrderId = null;
                    currentTrackId = null;
                    isUsingFallbackAudio = false;
                    if (obsFallbackAudio) {
                        obsFallbackAudio.pause();
                        obsFallbackAudio.src = '';
                    }
                    if (isYtReady && ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                        ytPlayer.stopVideo();
                    }
                    trackTime.innerText = '00:00 / 00:00';
                    widgetProgressFill.style.width = '0%';
                }
            });

            // Panel seeks → widget seeks too
            socket.on('command_seek', (seconds) => {
                if (isUsingFallbackAudio && obsFallbackAudio) {
                    obsFallbackAudio.currentTime = seconds;
                } else if (isYtReady && ytPlayer && typeof ytPlayer.seekTo === 'function') {
                    ytPlayer.seekTo(seconds, true);
                    ytPlayer.playVideo();
                }
            });

            // Panel play/pause → widget mirrors
            socket.on('command_play_pause', (isPlaying) => {
                if (isUsingFallbackAudio && obsFallbackAudio) {
                    if (isPlaying) obsFallbackAudio.play().catch(() => {});
                    else obsFallbackAudio.pause();
                } else if (isYtReady && ytPlayer) {
                    if (isPlaying) ytPlayer.playVideo();
                    else ytPlayer.pauseVideo();
                }
            });

            // Panel volume control → widget volume
            socket.on('command_set_volume', (vol) => {
                currentVolume = vol;
                if (obsFallbackAudio) obsFallbackAudio.volume = vol / 100;
                if (isYtReady && ytPlayer && typeof ytPlayer.setVolume === 'function') {
                    ytPlayer.setVolume(vol);
                }
            });
        }

        function updateWidgetCard(track) {
            if (!track) {
                widgetCard.classList.remove('visible');
                return;
            }

            trackTitle.innerText = track.title;
            trackRequester.innerText = track.requestedBy || 'Аноним';
            autoScaleTitle();
            widgetCard.classList.add('visible');
        }

        init();
    </script>
</body>
</html>
