<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varringard — Twitch Stream</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .home-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .home-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 50px rgba(145, 70, 255, 0.15);
            animation: fadeIn 0.4s ease;
        }

        .avatar-glow {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            padding: 3px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.4);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #111217;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-inner svg {
            width: 48px;
            height: 48px;
            fill: var(--accent-purple);
        }

        .home-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-twitch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: #9146ff;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(145, 70, 255, 0.4);
        }

        .btn-twitch:hover {
            background: #772ce8;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(145, 70, 255, 0.6);
        }

        .btn-order-music {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 0.85rem;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-order-music:hover {
            background: rgba(145, 70, 255, 0.15);
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="home-wrapper">
        <div class="home-card">
            <div class="avatar-glow">
                <div class="avatar-inner">
                    <svg viewBox="0 0 24 24">
                        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                    </svg>
                </div>
            </div>

            <h1 class="home-title">VARRINGARD</h1>
            <p class="home-subtitle">Добро пожаловать на канал! Прямые трансляции, общение и музыка.</p>

            <a href="https://twitch.tv/varringard" target="_blank" rel="noopener noreferrer" class="btn-twitch">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                </svg>
                <span>Перейти на Twitch канал</span>
            </a>

            <a href="/order-music" class="btn-order-music">
                <svg width="18" height="18" fill="var(--accent-purple)" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                <span>Заказать музыку на стрим</span>
            </a>
        </div>
    </div>
</body>
</html>
